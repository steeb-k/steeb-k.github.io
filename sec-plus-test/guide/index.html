<!-- Font preloads only over http(s): on file:// a crossorigin preload is a CORS error and never matches the CSS font request. -->
<script>if (location.protocol !== 'file:') ['Regular', 'SemiBold'].forEach(function (w) { var l = document.createElement('link'); l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2'; l.crossOrigin = 'anonymous'; l.href = '../../fonts/ibm-plex/IBMPlexSans-' + w + '.woff2'; document.head.appendChild(l); });</script>
<!-- Same theme choice as the practice site (stored in its settings); dark unless it says otherwise. -->
<script>(function () { var t = 'dark'; try { var s = JSON.parse(localStorage.getItem('secplus.settings') || '{}'); if (s.theme) t = s.theme; } catch (e) {} if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); })();</script>
