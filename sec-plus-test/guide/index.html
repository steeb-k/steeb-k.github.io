<h1>How to use this guide</h1>
<p class="lede">This is the web version of a set of Security+ SY0-701 study notes. The words are the same as the Markdown files on GitHub; the site just adds the things a text file can't do. Here's the quick tour. The notes themselves start at <a href="#/">Exam Overview</a>.</p>

<h2>Getting around</h2>
<ul>
<li>The sidebar lists every chapter: an exam overview, the five exam domains, and three reference sheets (ports, acronyms, formulas). Open a chapter and it expands to show its objectives. As you scroll, the sidebar keeps track of where you are.</li>
<li>Every chapter ends with Previous and Next links. On a keyboard, <kbd>[</kbd> and <kbd>]</kbd> do the same thing.</li>
<li>Hover a heading and a small <b>#</b> appears next to it. Click it to copy a link to that exact section, handy for notes or for sending someone a specific topic.</li>
<li>On a phone, the round button in the bottom-left corner opens the contents. It becomes a back arrow while the list is open; tap it, tap outside the list, or pick a section to close it.</li>
</ul>

<h2>Searching</h2>
<ul>
<li>Press <kbd>/</kbd> or click the search box. Results appear as you type: matching acronyms first, then sections, each with a breadcrumb and a snippet. Use <kbd>↑</kbd> <kbd>↓</kbd> and <kbd>Enter</kbd>, or just click one.</li>
<li>Your results stay in the sidebar after you open one, so you can work through them. When you're done, click <b>Back to outline</b>, press <kbd>Esc</kbd>, or clear the box.</li>
<li>Search matches the start of words, so "cert" finds certificate and certification, but "ate" won't find either.</li>
</ul>

<h2>Acronyms</h2>
<p>Security+ runs on acronyms, so any acronym in the text gets a dotted underline. Hover it (or tap it on a touch screen) for the expansion plus a one-line meaning, and a link to its row in the glossary. The <a href="#/acronyms">Acronyms</a> chapter has the full list, around five hundred of them, which is more than the exam will ask about but fewer than the industry uses.</p>

<h2>Highlighting</h2>
<ul>
<li>Hover over any paragraph, bullet, callout, or table row and a small marker appears in the left margin (on touch screens it's always visible). Click it to highlight; click again to take the highlight off.</li>
<li>Chapters and sections that contain highlights get a small count next to them in the sidebar, so you can see at a glance where your notes are.</li>
<li>The <a href="#/highlights">Highlighted</a> page collects all of them in chapter order. Each one has <b>View in context</b>, which jumps to the exact spot, and <b>Remove</b>. You can also export the lot as a Markdown file.</li>
<li>Highlights are saved in this browser only. Clearing the site's data or switching to another browser loses them, so export if they matter to you. If a paragraph's wording changes in a later version of the guide, its highlight moves to a "No longer found" list rather than vanishing.</li>
</ul>

<h2>Readiness dots and weak spots</h2>
<ul>
<li>If you use the <a href="../index.html" target="_blank" rel="noopener">practice tests</a> in the same browser, each objective in the sidebar gets a coloured dot: green for 83% and up, amber for 70% and up, red below that. It's based on your last five attempts that covered that objective, so it moves as you improve.</li>
<li><b>Weak spots</b>, at the bottom of the sidebar, lists your five lowest objectives as links. Nothing shows until you've answered some questions.</li>
<li>In the practice tests, the feedback after each question in practice mode links back to the matching objective here. Exam mode stays exam-like and doesn't.</li>
</ul>

<h2>Small things</h2>
<ul>
<li>Dark or light? The guide follows whatever you chose on the practice site's Settings page.</li>
<li>Keyboard shortcuts: <kbd>/</kbd> search, <kbd>Esc</kbd> close search, tooltip or contents, <kbd>[</kbd> and <kbd>]</kbd> previous and next chapter.</li>
<li>Print any chapter and the sidebar, tooltips and buttons stay out of the way.</li>
</ul>

<h2>One honest caveat</h2>
<p>All of this content was AI-generated and hasn't been vetted by a person yet. It's been through two accuracy passes, but that's not the same as a reviewer who has sat the exam. If something looks surprising, check it against the official CompTIA SY0-701 objectives and a published study guide before you trust it. Spotted a mistake? Every chapter ends with an <b>Edit this file on GitHub</b> link.</p>
